<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한강숲데이케어센터 송영표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --ink:#1d2a24; --sub:#5d6b64; --line:#dfe5e0;
  --green:#1f6b4f; --green-2:#e5f1eb; --am:#c2721b; --am-2:#fbf0e2; --pm:#3d5a9e; --pm-2:#e8edf8;
  --warn:#b3261e; --warn-2:#fbe9e7;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
[hidden]{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(20,50,35,.08)}
.login-box h1{font-size:20px;margin:0 0 4px}
.login-box p{margin:0 0 22px;color:var(--sub);font-size:14px}
.login-box label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.login-box input{width:100%;padding:11px 12px}
.login-box button{width:100%;margin-top:20px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px}

/* app */
header{background:var(--green);color:#fff;position:sticky;top:0;z-index:10}
.hbar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.hbar h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;border:none;color:#d4eadf;padding:7px 12px}
nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
#logout{background:transparent;color:#d4eadf;border-color:rgba(255,255,255,.3)}
.hdbtns{display:flex;gap:6px}
.hdbtns button{background:#fff;color:var(--green);border:none;font-weight:700;padding:8px 14px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9fd1b8;margin-right:5px;vertical-align:1px}
.status.live .dot{background:#5dff9f;box-shadow:0 0 0 3px rgba(93,255,159,.25)}
main{max-width:1280px;margin:0 auto;padding:16px}
.status{font-size:12px;color:#cfe5da}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.datebox{display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.datebox input{border:none;font-weight:700;font-size:16px}
.datebox button{border:none;padding:6px 10px}
.dow{font-weight:700;font-size:16px;margin-left:4px}
.dow.sat{color:var(--pm)} .dow.sun{color:var(--warn)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;padding:8px 18px;font-weight:500}
.seg button.on.am{background:var(--am);color:#fff}
.seg button.on.pm{background:var(--pm);color:#fff}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--sub);margin:4px 0 14px}
.summary b{color:var(--ink)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--green-2);color:var(--green);font-weight:500}
.pill.auto{background:#fff4d6;color:#8a6100}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.car{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.car-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.car-h .nm{font-weight:700;font-size:17px}
.car-h .plate{font-size:13px;color:var(--sub);background:var(--bg);padding:2px 8px;border-radius:6px}
.crew{display:flex;gap:6px;width:100%}
.crew label{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.crew input{flex:1;min-width:0;padding:5px 7px}
.run{border-top:1px dashed var(--line)}
.run:first-of-type{border-top:none}
.run-h{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px}
.am-mode .run-h{background:var(--am-2)} .pm-mode .run-h{background:var(--pm-2)}
.run-h .t{font-weight:700;font-size:15px}
.am-mode .run-h .t{color:var(--am)} .pm-mode .run-h .t{color:var(--pm)}
.run-h .cnt{margin-left:auto;font-weight:700}
.run-h .cnt.over{color:var(--warn)}
ol.list{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:9px 12px 9px 14px;border-top:1px solid #eef1ee;align-items:start}
.it:first-child{border-top:none}
.num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.am-mode .num{background:var(--am)} .pm-mode .num{background:var(--pm)}
.nm2{font-weight:700}
.meta{font-size:12px;color:var(--sub);margin-left:4px;font-weight:400}
.addr{font-size:13px;color:var(--sub);margin-top:2px}
.note{font-size:12.5px;margin-top:3px;background:#fff8e6;border-radius:5px;padding:2px 6px;display:inline-block;color:#6b4a00}
.want{font-size:12px;color:var(--warn);font-weight:500;margin-left:4px}
.ctl{display:flex;gap:2px;align-items:center}
.ctl button{padding:3px 7px;font-size:13px}
.ctl select{font-size:12px;padding:3px 4px;max-width:96px}
.empty{padding:12px 14px;color:#a3aea8;font-size:13px}
.over-msg{padding:6px 14px;background:var(--warn-2);color:var(--warn);font-size:12.5px}

.side{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:99px;background:var(--bg);font-size:13px}
.chip button{padding:1px 7px;font-size:12px;border-radius:99px}
.warnbox{border-color:#f0c3bd;background:var(--warn-2)}

/* tables */
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid #eef1ee;text-align:left;vertical-align:middle;white-space:nowrap}
th{background:#f8faf8;position:sticky;top:0;font-weight:500;color:var(--sub);font-size:12.5px;z-index:1}
td input{width:100%;min-width:60px;padding:4px 6px}
td input.w-addr{min-width:260px} td input.w-note{min-width:240px}
.days{display:flex;gap:2px}
.days button{padding:3px 6px;font-size:12px;border-radius:5px;min-width:26px}
.days button.on{background:var(--green);border-color:var(--green);color:#fff}
tr.off td{opacity:.5}
.hint{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.6}
.satbox{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}.satbox summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.need{color:#e00;font-weight:700}
.stw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
table.stt{border-collapse:collapse;font-size:12px;white-space:nowrap}
.stt th,.stt td{border:1px solid #e3e6ea;padding:0;text-align:center;min-width:26px;height:26px}
.stt th{background:#f5f7f9;font-weight:600;position:sticky;top:0;z-index:2}
.stt th.wd{top:27px}
.stt td.nm,.stt th.nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 8px;min-width:78px}
.stt th.nm{z-index:3;background:#f5f7f9}
.stt td.rl{color:var(--sub);font-size:11px;padding:0 6px}
.stt .sun{color:#d33}.stt .sat{color:#2a62c9}
.stt td.x{background:linear-gradient(to top right,transparent calc(50% - 1.5px),#e00 calc(50% - 1px),#e00 calc(50% + 1px),transparent calc(50% + 1.5px))}
.stt td.yc{background:#ffe1e1;color:#d00;font-weight:700}
.stt td.hc{background:#fff0d6;color:#b36b00}
.stt td.o{color:#9aa3ad}
.stt .today{outline:2px solid #2a62c9;outline-offset:-2px}
.stt td.oncar{font-weight:700}
.offlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.offlist span{background:#ffe9e9;color:#c00;border-radius:12px;padding:3px 10px;font-size:13px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.vcard .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.vcard .row label{width:84px;font-size:13px;color:var(--sub);flex-shrink:0}
.vcard .row input{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
.banner{background:#fff4d6;border:1px solid #f0dc9c;color:#6b4a00;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

/* ===== 송영표 (출력 양식) ===== */
.sheetwrap{overflow:auto;background:#e9ece9;border-radius:14px;padding:14px;margin-bottom:14px}
.sheet{--rg:18px;--rm:16px;--cm:12px;width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:22px 18px 30px;color:#000;font-family:"Noto Sans KR",sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sh-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-lbl{background:#ffff00;font-weight:700;font-size:15px;padding:2px 8px}
.sh-date{flex:1;text-align:center;font-weight:700;font-size:19px}
.sh-box{border:1.5px solid #000;min-width:92px;text-align:center;padding:3px 8px;font-size:14px;font-weight:500}
.sh-box.c1{background:#fde2d2;border-color:#d55}
.sh-box.c2{background:#fde2d2}
.sh-box.tot{min-width:110px;font-weight:700;font-size:17px}
.sh-box.c1.am,.sh-box.c2.am{background:#d9ead3;border-color:#6a9a5b}.sh-box.tot.am{border-color:#e00;color:#e00}
.sh-car{display:flex;align-items:center;margin:var(--cm) 0 4px;border-top:0}
.sh-car{gap:8px;border-bottom:2px solid #3aa0c8;padding-bottom:3px}
.sh-car .cn{border:1.5px solid #3aa0c8;background:#e8f6fb;font-weight:700;font-size:15px;padding:2px 10px;cursor:pointer}
.sh-car .cp{font-size:12px;color:#555;background:#fdf3d4;border-radius:4px;padding:1px 7px;cursor:pointer}
.sh-car .cc{margin-left:auto;display:inline-flex;align-items:baseline;gap:3px;background:#1f8a4c;color:#fff;border-radius:6px;padding:2px 12px;font-size:13px;font-weight:500}
.sh-car .cc.pm{background:#e0518f}
.sh-car .cc b{font-size:20px;font-weight:700;line-height:1.2}
.sh-car .cc small{font-size:11.5px;opacity:.85;margin-left:6px}
.sh-run .rl b,.sh-run .rl2 b{cursor:pointer}
.sh-run{display:grid;grid-template-columns:90px repeat(7,minmax(0,1fr));column-gap:6px;row-gap:var(--rg);margin:var(--rm) 0 4px;align-items:start}
.sheet.a4fit{min-height:0;padding:12px 12px 14px;box-shadow:none}
.sheet.tight .sh-top{margin-bottom:2px}.sheet.tight .sh-box{padding:1px 8px}
.sheet.tight .bx .t{height:16px;line-height:15px;font-size:11.5px}
.sheet.tight .bx .n{height:20px;line-height:20px;font-size:13.5px}
.sheet.tight .bx .p{height:17px;line-height:17px}
.sheet.tight .bx .c{margin-top:1px;line-height:1.15}
.sheet.tight .sh-run .rl{padding-top:8px;line-height:1.45}.sheet.tight .sh-run .rl2{padding-top:6px;line-height:1.4}
.sheet.tight2 .bx .c{white-space:nowrap;overflow:hidden;font-size:9px;letter-spacing:-.3px}
.sh-run .rl2{text-align:center;line-height:1.6;padding-top:14px}
.sh-run .rl2 b{font-size:13.5px;display:block}.sh-run .rl2 span{font-size:12.5px}
.sh-run .rl{padding-top:18px;text-align:center;line-height:1.75}
.sh-run .rl b{font-size:14.5px;font-weight:700;display:block}
.sh-run .rl span{font-size:13.5px}
.sh-boxes{display:grid;grid-template-columns:repeat(7,1fr);column-gap:6px;row-gap:16px}
.bx{position:relative;cursor:pointer}
.bx .in{border:1px solid #444;position:relative;background:#fff}
.bx .dn{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:500}
.bx .t{border-bottom:1px solid #444;text-align:center;font-size:12px;font-weight:700;height:19px;line-height:18px}
.bx .t.hl,.bx .t.hl-y{background:#ffff00}
.bx .t.hl-b{background:#9bd7ff}
.bx .t.hl-g{background:#7ee08a}
.bx .t.hl-o{background:#fbd3b0}
.hlpick{display:flex;gap:4px;flex:1;flex-wrap:wrap}.hp{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px;width:auto!important;color:var(--ink)!important}.hp input{margin:0}.hp-y{background:#ffff66}.hp-b{background:#bfe6ff}.hp-g{background:#b6efbe}.hp-o{background:#fbd3b0}
.bx .n{text-align:center;font-size:14px;font-weight:700;height:24px;line-height:24px;border-bottom:1px dashed #888;white-space:nowrap;overflow:hidden}
.bx .p{text-align:center;font-size:10.5px;line-height:20px;height:20px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.2px}
.bx .c{text-align:center;font-size:9.5px;color:#d00;font-weight:700;margin-top:3px;line-height:1.25;word-break:keep-all}
.bx .nt{text-align:center;font-size:9px;color:#d00;line-height:1.2}
.bx .xl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bx.ns{opacity:.3}
.bx.sel .in{outline:3px solid #2f7bf6;outline-offset:1px}
.sh-un{margin-top:18px;border:1.5px dashed #c00;padding:8px}
.sh-un h4{margin:0 0 10px;font-size:13px;color:#c00}
.crewl{cursor:pointer}.crewl:hover span{text-decoration:underline}
.sheet.exporting .bx{cursor:default}
.sheet.exporting .bx.sel .in{outline:none}
.sheet.exporting .sh-un{display:none}
.sheet.exporting .crewl i{visibility:hidden}
/* 편집 팝업 */
#pop{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:300px;font-size:14px}
#pop h4{margin:0 0 8px;font-size:16px}
#pop .r{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#pop .r label{width:44px;font-size:12.5px;color:var(--sub)}
#pop .r input,#pop .r select{flex:1;min-width:0}
#pop .btns{display:flex;flex-wrap:wrap;gap:6px}
.dlnote{font-size:12.5px;color:var(--sub)}
.srch{position:relative}
.srch input{width:220px;padding:8px 10px;font-size:15px}
#srchRes{position:absolute;top:100%;left:0;z-index:30;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:340px;max-height:420px;overflow:auto}
#srchRes:empty{display:none}
.sr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid #eef1ee}
.sr:first-child{border-top:none}
.sr .nm{font-weight:700;font-size:15px}
.sr .stt{font-size:12.5px;color:var(--sub);flex:1}
.sr .stt.bad{color:var(--warn);font-weight:500}
.sr button{padding:5px 12px}
.sr button.abs{color:var(--warn);border-color:#f0c3bd}
.bx.flash .in{outline:3px solid #f5a623;outline-offset:2px}
.upbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.upbox h3{margin:0 0 6px;font-size:15px}
.drop{border:2px dashed #b9c8bf;border-radius:12px;padding:18px;text-align:center;color:var(--sub);cursor:pointer;background:#f8fbf9}
.drop.on{border-color:var(--green);background:var(--green-2)}
.prev{margin-top:12px;font-size:13.5px;line-height:1.7}
.prev .grp{margin:6px 0}
.prev .grp b{display:inline-block;min-width:120px}
button.del{color:var(--warn);border-color:#f0c3bd;padding:3px 8px;font-size:12.5px}
@page{size:A4 portrait;margin:4mm}
@media print{
  body{background:#fff}
  #login,header,.toolbar,.summary,.side,.banner,#pop,#toast,.sh-un{display:none!important}
  main{padding:0;max-width:none}
  .sheetwrap{background:none;padding:0;margin:0;overflow:visible;border-radius:0}
  .sheet{box-shadow:none;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bx.sel .in{outline:none}.crewl i{visibility:hidden}
}
@media(max-width:760px){
  body{font-size:14px}
  .hbar{padding:6px 8px;gap:6px}.hbar h1{display:none}
  nav{flex:1 1 100%;order:1}nav button{padding:6px 8px;font-size:13px}
  .hdbtns{order:2;flex:1}.hdbtns button{padding:6px 9px;font-size:12px}
  #conn{display:none}#logout{order:3;padding:5px 9px;font-size:12px}
  main{padding:8px}
  .toolbar{gap:6px}.datebox input{font-size:14px;width:118px}.dow{font-size:14px}
  .seg button{padding:7px 10px;font-size:13px}
  .srch{flex:1 1 100%}.srch input{width:100%}
  #srchRes{min-width:0;width:100%}
  .toolbar>button{padding:6px 9px;font-size:12.5px}
  .sheetwrap{padding:4px;border-radius:8px;overflow:hidden}
  .side,.grid{grid-template-columns:1fr}
  #pop{left:8px!important;right:8px;width:auto!important;top:auto!important;bottom:8px;max-height:70vh;overflow:auto}
  .vgrid{grid-template-columns:1fr}
  .login-box{padding:24px 18px}
}
</style>
</head>
<body>

<div id="login">
  <form class="login-box" id="loginForm" autocomplete="off">
    <h1>한강숲데이케어센터</h1>
    <p>송영표 관리</p>
    <label for="uid">아이디</label>
    <input id="uid" autocomplete="username">
    <label for="upw">비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button class="primary" type="submit">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <header><div class="hbar">
    <h1>한강숲 송영표</h1>
    <nav>
      <button data-v="daily" class="on">날짜별 송영표</button>
      <button data-v="elders">어르신 목록</button>
      <button data-v="cars">차량·시간 설정</button>
      <button data-v="staff">직원출근표</button>
    </nav>
    <span class="hdbtns" id="hdExport"><button id="hPrint">🖨 출력 (A4)</button><button id="hJpg">JPG 저장</button><button id="hCopy">JPG 복사</button></span>
    <span class="status" id="conn"><i class="dot"></i>연결 중…</span>
    <button id="logout">로그아웃</button>
  </div></header>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// ---------- 로그인 ----------
const LOGIN_ID='supdc0301', LOGIN_PW='supdc0301!';
function getAuth(){try{return sessionStorage.getItem('sdc_auth')==='1'}catch(e){return false}}
function setAuth(v){try{v?sessionStorage.setItem('sdc_auth','1'):sessionStorage.removeItem('sdc_auth')}catch(e){}}
const SERVER=!!window.SDC_SERVER;   // 자체 서버 버전이면 서버가 로그인을 확인
let authed=SERVER?false:getAuth();

document.getElementById('logout').onclick=()=>{if(SERVER)window.SDC.logout();authed=false;setAuth(false);location.hash='';document.getElementById('app').hidden=true;document.getElementById('login').hidden=false;document.getElementById('upw').value='';};
function showApp(){document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;render();}

// ---------- 상태 ----------
const DOW=['일','월','화','수','목','금','토'];
const DEFAULT_CONFIG={vehicles:[
  {id:'v1',name:'1호차',plate:'5562',cap:8,assistant:true,driver:'',helper:'',am:['08:00','09:00'],pm:['16:30','17:30']},
  {id:'v2',name:'2호차',plate:'5678',cap:8,assistant:true,driver:'',helper:'',am:['08:00','09:00'],pm:['16:30','17:30']},
  {id:'v3',name:'3호차',plate:'',cap:4,assistant:false,driver:'',helper:'',am:['08:00','09:00'],pm:['16:30','17:30']},
  {id:'v4',name:'4호차',plate:'',cap:4,assistant:false,driver:'',helper:'',am:['08:00','09:00'],pm:['16:30','17:30']},
  {id:'v5',name:'5호차',plate:'',cap:4,assistant:false,driver:'',helper:'',am:['08:00','09:00'],pm:['16:30','17:30']},
]};
let db=null, readOnly=false;
let config=null;           // config/main
let elders={};             // id -> data
let dayDoc=null;           // days/<date>
let dayLoaded=false;
let view='daily';
let session=(new Date().getHours()<12)?'am':'pm';
let curDate=todayStr();
let unsubDay=null;
let searchQ='';
const dayView='sheet'; let downloads=null, selId=null;

function todayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d)}
function wd(s){return new Date(s+'T00:00:00').getDay()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function cfg(){return config||DEFAULT_CONFIG}
function vehicles(){return cfg().vehicles||[]}
function vehiclesFor(S){const vs=vehicles(),ord=cfg()['order'+CK(S)]||cfg()['order'+CAP[S]]||[];const r=v=>{const i=ord.indexOf(v.id);return i<0?999:i};return [...vs].sort((a,b)=>r(a)-r(b))}
const isTime=t=>/^\d{1,2}:\d{2}$/.test(String(t||'').trim());
const runLabel=t=>isTime(t)?t+' 출발':t;
function vById(id){return vehicles().find(v=>v.id===id)}
function eldersArr(){return Object.values(elders).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}

// ---------- 저장 (문서별 한 번에 하나, 최신값으로 합치기) ----------
const pending={}, inflight={};
let lastLocal=0;
function save(path,data){
  lastLocal=Date.now();
  if(!db){toast('저장소에 연결되지 않았습니다');return}
  if(readOnly){toast('보기 전용 권한이라 저장할 수 없습니다');return}
  pending[path]=data; if(!inflight[path]) flush(path);
}
async function flush(path){
  inflight[path]=true;
  while(pending[path]){
    const d=pending[path]; delete pending[path];
    try{await db.doc(path).set(d)}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{await db.doc(path).set(d)}catch(e2){toast('저장 실패, 다시 시도해 주세요')}}
      else if(e&&e.code==='invalid_argument'){readOnly=true;toast('저장 권한이 없습니다 (보기 전용)')}
      else toast('저장 실패: '+(e&&e.code||'오류'));
    }
  }
  inflight[path]=false;
}

// ---------- 출석 / 배차 계산 ----------
function runKeys(S){const ks=[];vehiclesFor(S).forEach(v=>(v[SK(S)]||[]).forEach((t,i)=>ks.push(v.id+'#'+i)));return ks}
function keyInfo(S,k){const [vid,i]=k.split('#');const v=vById(vid);return v?{v,idx:+i,time:(v[SK(S)]||[])[+i]||''}:null}
function keyLabel(S,k){const x=keyInfo(S,k);return x?`${vname(x.v,S)} ${x.idx+1}회차${x.time?'('+x.time+')':''}`:k}
function attending(date,dd){
  const w=wd(date), ab=new Set((dd&&dd.absent)||[]), ex=new Set((dd&&dd.extra)||[]);
  return eldersArr().filter(e=>e.status!=='중지' && (!e.start||e.start<=date) && ((e.days||[]).includes(w)||ex.has(e.id)) && !ab.has(e.id));
}
function prefRun(e,S,v){
  const want=S==='am'?e.wantAm:e.wantPm, ts=v[SK(S)]||[]; if(!want||!ts.length) return -1;
  let best=0,bd=1e9; ts.forEach((t,i)=>{const d=Math.abs(toMin(t)-toMin(want));if(d<bd){bd=d;best=i}});return best;
}
function toMin(t){const m=/(\d+):(\d+)/.exec(t||'');return m?(+m[1])*60+(+m[2]):0}
function autoFill(S,lists,rem){
  const left=[];
  rem.sort((a,b)=>(a.area||'').localeCompare(b.area||'','ko')||(a.address||'').localeCompare(b.address||'','ko'));
  for(const e of rem){
    let best=null,bs=-1e9;
    for(const k of Object.keys(lists)){
      const x=keyInfo(S,k); if(!x) continue;
      const free=x.v.cap-lists[k].length; if(free<=0) continue;
      const same=lists[k].filter(id=>elders[id]&&elders[id].area===e.area).length;
      const pr=prefRun(e,S,x.v);
      const s=same*10+(pr===x.idx?8:(pr>=0?-8:0))+free/x.v.cap*3-x.idx*0.5;
      if(s>bs){bs=s;best=k}
    }
    if(best) lists[best].push(e.id); else left.push(e);
  }
  return left;
}
function computeSession(S,dd,att,amRes){
  const lists={}; runKeys(S).forEach(k=>lists[k]=[]);
  const attIds=new Set(att.map(e=>e.id)), placed=new Set();
  if(dd&&dd[S]){
    for(const k in dd[S]) if(lists[k]) for(const id of dd[S][k]) if(attIds.has(id)&&!placed.has(id)){lists[k].push(id);placed.add(id)}
    return {lists,unassigned:att.filter(e=>!placed.has(e.id)).map(e=>e.id),saved:true};
  }
  // 1) 기본표
  const K=SK(S);
  const withDef=att.filter(e=>e.def&&e.def[K]&&lists[e.def[K].k]).sort((a,b)=>(a.def[K].o||0)-(b.def[K].o||0));
  for(const e of withDef){lists[e.def[K].k].push(e.id);placed.add(e.id)}
  // 토요일 기본표에 있지만 이 시간대엔 안 타는 어르신은 자동배치하지 않음
  const skipSat=id=>{const e=elders[id];return K!==S&&e&&e.def&&(e.def.satam||e.def.satpm)&&!e.def[K]};
  // 2) 오후: 오전 배차를 역순으로 따라감
  if(S==='pm'&&amRes){
    for(const k in amRes.lists){
      const [vid,i]=k.split('#'); const v=vById(vid); if(!v) continue;
      const pk=vid+'#'+Math.min(+i,(v[SK('pm')]||[]).length-1); if(!lists[pk]) continue;
      [...amRes.lists[k]].reverse().forEach(id=>{if(!placed.has(id)&&attIds.has(id)&&!skipSat(id)&&lists[pk].length<v.cap){lists[pk].push(id);placed.add(id)}});
    }
  }
  // 3) 나머지는 동네별 자동배치
  const rem=att.filter(e=>!placed.has(e.id)&&!skipSat(e.id));
  const left=autoFill(S,lists,rem);
  return {lists,unassigned:left.map(e=>e.id),saved:false};
}
function computeDay(){
  const att=attending(curDate,dayDoc);
  const am=computeSession('am',dayDoc,att,null);
  const pm=computeSession('pm',dayDoc,att,am);
  return {att,am,pm};
}
function timeOf(S,id){const t=dayDoc&&dayDoc.times&&dayDoc.times[S]&&dayDoc.times[S][id];if(t!=null&&t!=='')return t;const e=elders[id],K=SK(S);return (e&&e.def&&e.def[K]&&e.def[K].t)||''}
function hlOf(S,id){const e=elders[id];const c=e&&e.hl&&e.hl[SK(S)];if(c)return c;return (dayDoc&&dayDoc.hl&&(dayDoc.hl[S]||[]).includes(id))?'y':''}
function isHl(S,id){return !!hlOf(S,id)}
function daysLabel(ds){ds=[...(ds||[])].sort();const k=ds.join('');if(k==='12345')return '';if(k==='123456')return '월~토';if(k==='23456')return '화~토';
  const all=[1,2,3,4,5];if(ds.every(d=>d>=1&&d<=5)&&ds.length===4){const miss=all.find(d=>!ds.includes(d));return DOW[miss]+'X'}
  return ds.map(d=>DOW[d]).join('')}
function shortPlace(s){
  s=String(s||'').replace(/^서울(특별시)?\s*/,'').replace(/^\S+구\s+/,'');
  s=s.replace(/\([^)]*\)/g,' ').replace(/아파트/g,'').replace(/(\S+?)동\s*(\d+)\s*호/g,'$1-$2').replace(/(\d+)동\s+(?=\d)/g,'$1-').replace(/(\d+-\d+)호/g,'$1');
  s=s.replace(/\s+/g,' ').trim();
  const m=/^(\S*?(로|길)\s?\d+(-\d+)?)\s+([^\d\s].*)$/.exec(s);
  if(m&&/[가-힣A-Za-z]{2,}/.test(m[4])) s=m[4];
  return s.replace(/\s*-\s*/g,'-').trim();
}
const CAP={am:'Am',pm:'Pm',satam:'SatAm',satpm:'SatPm'};
// 토요일은 별도 기본표(satam/satpm), 평일은 am/pm
function SK(S,date=curDate){return wd(date)===6?'sat'+S:S}
function CK(S){return CAP[SK(S)]}
function vname(v,S){return (wd(curDate)===6&&v['name'+CK(S)])||v.name}
function crewOf(v,S=session){
  const c=(dayDoc&&dayDoc.crew&&dayDoc.crew[S]&&dayDoc.crew[S][v.id])||{};
  const dd=v['driver'+CK(S)], dh=v['helper'+CK(S)];
  const sat=wd(curDate)===6;return {driver:c.driver??(dd!=null&&dd!==''?dd:(sat?'':(v.driver||''))),helper:c.helper??(dh!=null&&dh!==''?dh:(sat?'':(v.helper||'')))};
}
// "1+3/2+4", "1(4)/2(4)" → [[{i,wrap}],...]  (회차 번호는 1부터)
function parseLayout(str,n){
  const rows=[],used=new Set();
  String(str||'').split('/').forEach(r=>{
    const row=[];
    r.split('+').forEach(t=>{const m=/(\d+)\s*(?:\((\d+)\))?/.exec(t);if(!m)return;const i=+m[1]-1;if(i<0||i>=n||used.has(i))return;used.add(i);row.push({i,wrap:m[2]?Math.max(1,Math.min(7,+m[2])):7})});
    if(row.length) rows.push(row);
  });
  for(let i=0;i<n;i++) if(!used.has(i)) rows.push([{i,wrap:7}]);
  return rows;
}

// 현재 화면 상태를 그날 문서로 고정 저장
function commitDay(mut){
  const cur=computeDay();
  const next={
    am:cur.am.lists, pm:cur.pm.lists,
    absent:[...((dayDoc&&dayDoc.absent)||[])], extra:[...((dayDoc&&dayDoc.extra)||[])],
    crew:(()=>{const c=JSON.parse(JSON.stringify((dayDoc&&dayDoc.crew)||{}));return {am:c.am||{},pm:c.pm||{}}})(),
    times:JSON.parse(JSON.stringify((dayDoc&&dayDoc.times)||{am:{},pm:{}})),
    hl:JSON.parse(JSON.stringify((dayDoc&&dayDoc.hl)||{am:[],pm:[]})),
    prev:JSON.parse(JSON.stringify((dayDoc&&dayDoc.prev)||{})),
  };
  next.times.am=next.times.am||{};next.times.pm=next.times.pm||{};next.hl.am=next.hl.am||[];next.hl.pm=next.hl.pm||[];
  mut(next);
  next.updatedAt=new Date().toISOString();
  dayDoc=next; render(); save('days/'+curDate,next);
}
function removeEverywhere(n,id){for(const S of ['am','pm']) for(const k in n[S]) n[S][k]=n[S][k].filter(x=>x!==id)}
// 결석: 원래 자리(차량·순서)를 기억해 두고 빼기
function markAbsent(n,id){
  n.prev=n.prev||{}; const pv={};
  for(const S of ['am','pm']) for(const k in n[S]){const i=n[S][k].indexOf(id);if(i>=0)pv[S]={k,i}}
  n.prev[id]=pv; removeEverywhere(n,id); n.extra=n.extra.filter(x=>x!==id); if(!n.absent.includes(id)) n.absent.push(id);
}
// 출석으로: 기억한 자리 → 없으면 기본표 자리로 되돌림
function unAbsent(n,id){
  n.absent=n.absent.filter(x=>x!==id); const pv=(n.prev&&n.prev[id])||{}, e=elders[id]||{};
  for(const S of ['am','pm']){
    let k=pv[S]&&pv[S].k, i=pv[S]?pv[S].i:null;
    const K=SK(S);
    if(!k&&e.def&&e.def[K]){k=e.def[K].k;const o=e.def[K].o;const L=n[S][k]||[];i=L.filter(x=>{const d=elders[x]&&elders[x].def&&elders[x].def[K];return d&&d.k===k&&d.o<o}).length}
    if(!k||!n[S][k]) continue; const L=n[S][k]; if(L.includes(id)) continue;
    L.splice(Math.min(i??L.length,L.length),0,id);
  }
  if(n.prev) delete n.prev[id];
}

// ---------- 화면: 날짜별 송영표 ----------
function renderDaily(){
  const w=wd(curDate);
  const {att,am,pm}=computeDay();
  const R=session==='am'?am:pm;
  const saved=!!(dayDoc&&dayDoc[session]);
  const absent=((dayDoc&&dayDoc.absent)||[]).filter(id=>elders[id]);
  const scheduledNot=eldersArr().filter(e=>e.status!=='중지'&&!att.find(a=>a.id===e.id)&&!absent.includes(e.id));
  const keys=runKeys(session);
  const opts=k0=>keys.map(k=>`<option value="${k}" ${k===k0?'selected':''}>${esc(keyLabel(session,k))}</option>`).join('')+`<option value="__un">미배정으로</option><option value="__ab">결석 처리</option>`;
  let h=`<div class="toolbar">
    <div class="datebox"><button id="prev">◀</button><input type="date" id="dt" value="${curDate}"><span class="dow ${w===6?'sat':w===0?'sun':''}">(${DOW[w]})</span><button id="next">▶</button></div>
    <button id="today">오늘</button>
    <div class="seg"><button class="am ${session==='am'?'on':''}" data-s="am">오전 송영</button><button class="pm ${session==='pm'?'on':''}" data-s="pm">오후 송영</button></div>
    <div class="srch"><input id="srch" placeholder="🔍 어르신 이름 (결석·출석)" value="${esc(searchQ)}" autocomplete="off"><div id="srchRes"></div></div>
    <span class="spacer"></span>
    <button id="copyTxt">카톡 텍스트</button>
    <button id="reauto" title="이 날 이 시간대에 바꾼 배치를 지우고 기본표대로 다시 보여줍니다">기본표로 되돌리기</button>
    <button id="saveDef" class="primary" title="오늘 오전·오후 배치를 어르신별 기본 배차로 저장">이 배치를 기본표로</button>
  </div>
  <div class="summary">
    <span>이용 <b>${att.length}명</b></span><span>결석 <b>${absent.length}명</b></span>
    <span>미배정 <b>${R.unassigned.length}명</b></span>
    <span>${saved?'<span class="pill">확정 저장됨</span>':'<span class="pill auto">기본표 (수정하면 그날 표로 저장)</span>'}</span>
  </div>`;
  if(w===0) h+=`<div class="banner">일요일입니다. 이용 요일에 일요일이 있는 어르신만 표시됩니다.</div>`;
  if(session==='pm'&&!saved&&!(dayDoc&&dayDoc.pm)) h+='';
  if(dayView==='sheet'){h+=`<div class="sheetwrap">${renderSheet(R,att)}</div>`;}
  else {
  h+=`<div class="grid ${session}-mode">`;
  for(const v of vehiclesFor(session)){
    const c=crewOf(v);
    h+=`<div class="car"><div class="car-h"><span class="nm">${esc(v.name)}</span>${v.plate?`<span class="plate">${esc(v.plate)}</span>`:''}
      <span class="meta">정원 ${v.cap}명 · ${v.assistant?'운전자+보조자':'운전자만'}</span>
      <div class="crew"><label>운전<input data-crew="${v.id}" data-f="driver" value="${esc(c.driver)}" placeholder="운전자"></label>
      ${v.assistant?`<label>보조<input data-crew="${v.id}" data-f="helper" value="${esc(c.helper)}" placeholder="보조자"></label>`:''}</div></div>`;
    (v[session]||[]).forEach((t,i)=>{
      const k=v.id+'#'+i, L=R.lists[k]||[], over=L.length>v.cap;
      h+=`<div class="run"><div class="run-h"><span class="t">${i+1}회차 ${esc(runLabel(t))}</span><span>${session==='am'?'출발':'출발'}</span><span class="cnt ${over?'over':''}">${L.length}/${v.cap}</span></div>`;
      if(over) h+=`<div class="over-msg">정원 ${v.cap}명을 넘었습니다. 다른 차량으로 옮겨 주세요.</div>`;
      h+= L.length?`<ol class="list">`+L.map((id,n)=>itemHtml(id,n,k,L.length,opts(k))).join('')+`</ol>`:`<div class="empty">배정된 어르신 없음</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  }
  h+=`<div class="side">`;
  if(dayView==='cards'&&R.unassigned.length){
    h+=`<div class="box warnbox"><h3>미배정 ${R.unassigned.length}명</h3><ol class="list">`+R.unassigned.map((id,n)=>itemHtml(id,n,'__un',0,opts(''))).join('')+`</ol></div>`;
  }
  h+=`<div class="box"><h3>결석 (${absent.length})</h3><div class="chips">${absent.map(id=>`<span class="chip">${esc(elders[id].name)}<button data-unabs="${id}">출석으로</button></span>`).join('')||'<span class="meta">없음</span>'}</div></div>`;
  h+=`<div class="box"><h3>오늘 추가 출석</h3><p class="hint" style="margin:0 0 8px">이용 요일이 아닌 어르신을 오늘만 추가합니다.</p>
     <select id="addExtra"><option value="">어르신 선택…</option>${scheduledNot.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.area)})</option>`).join('')}</select></div>`;
  h+=`</div>`;
  return h;
}
function itemHtml(id,n,k,len,options){
  const e=elders[id]; if(!e) return '';
  const want=session==='am'?e.wantAm:e.wantPm;
  return `<li class="it"><span class="num">${k==='__un'?'·':n+1}</span><div>
    <div class="nm2">${esc(e.name)}<span class="meta">${esc(e.sex)} · ${esc(e.grade)} · ${esc(e.area)}</span>${want?`<span class="want">희망 ${esc(want)}</span>`:''}</div>
    <div class="addr">${esc(e.address)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div>
    <div class="ctl">${k!=='__un'?`<button data-up="${id}" data-k="${k}" ${n===0?'disabled':''}>↑</button><button data-dn="${id}" data-k="${k}" ${n===len-1?'disabled':''}>↓</button>`:''}
    <select data-mv="${id}" data-k="${k}"><option value="">이동…</option>${options}</select></div></li>`;
}
function renderSheet(R,att){
  const S=session, w=wd(curDate);
  const ab=new Set((dayDoc&&dayDoc.absent)||[]);

function fitA4(el){
  el.classList.add('a4fit');
  const target=el.offsetWidth*297/210;
  // 내용이 너무 길면 박스 안쪽을 촘촘하게(1단계→2단계)
  const minH=()=>{['--rg','--rm','--cm'].forEach(v=>el.style.setProperty(v,'3px'));return el.scrollHeight};
  if(minH()>target) el.classList.add('tight');
  if(minH()>target) el.classList.add('tight2');
  let k=1;
  for(let i=0;i<8;i++){
    el.style.setProperty('--rg',(18*k)+'px'); el.style.setProperty('--rm',(16*k)+'px'); el.style.setProperty('--cm',(12*k)+'px');
    const h=el.scrollHeight, gaps=el.querySelectorAll('.sh-run').length*2+el.querySelectorAll('.sh-car').length;
    const diff=target-h; if(Math.abs(diff)<4) break;
    const per=diff/Math.max(gaps,1);            // 간격 하나당 늘리거나 줄일 양(px)
    k=Math.max(0.15,Math.min(4,k+per/15));
  }
  return Math.min(1,target/el.scrollHeight);   // 그래도 길면 이만큼 줄여서 한 장에
}

let xPlan=null;
function normDate(v){if(v==null||v==='')return '';if(v instanceof Date)return todayStr(v);if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}
  const m=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(v));return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}
function areaOf(addr){let m=/\(([^,)]+)/.exec(addr||'');let a=m?m[1].trim():'';if(!a){m=/(\S+동)(\s|$)/.exec(addr||'');a=m?m[1]:''}return a.replace(/\d+동$/,'동')}
function parseRoster(wb){
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='수급자명')); if(hi<0) continue;
    const H=rows[hi].map(c=>String(c).trim()); const col=n=>H.indexOf(n);
    const ci={st:col('수급현황'),name:col('수급자명'),sex:col('성별'),grade:col('인정등급'),group:col('케어그룹'),start:col('급여개시일'),end:col('퇴소일'),addr:col('주소'),gname:col('보호자명'),rel:col('관계'),gphone:col('휴대폰'),phone:col('연락처')};
    const out=[];
    for(const r of rows.slice(hi+1)){
      const name=String(r[ci.name]||'').trim(); if(!name||/^전체|명$/.test(name)&&name.length>6) continue;
      if(ci.st>=0&&!String(r[ci.st]||'').trim()) continue;
      const g=k=>ci[k]>=0?String(r[ci[k]]??'').trim():'';
      const rel=g('rel').replace(/가족\(|\)/g,'');
      out.push({name,sex:g('sex'),grade:g('grade'),group:g('group'),start:ci.start>=0?normDate(r[ci.start]):'',end:ci.end>=0?normDate(r[ci.end]):'',
        address:g('addr').replace(/^서울(특별시)?\s*/,''),status:g('st'),contact:g('gphone')?((rel?rel+' ':'')+g('gphone')):g('phone')});
    }
    if(out.length) return out;
  }
  return null;
}
function planRoster(list){
  const byName={}; eldersArr().forEach(e=>{(byName[e.name]=byName[e.name]||[]).push(e)});
  const add=[],upd=[],same=[],seen=new Set();
  for(const x of list){
    const ex=(byName[x.name]||[])[0];
    const stop=(x.status&&x.status!=='수급중')||(x.end&&x.end<=todayStr());
    if(!ex){add.push({...x,stop});continue}
    seen.add(ex.id);
    const patch={};
    for(const f of ['sex','grade','group','address']) if(x[f]&&x[f]!==ex[f]) patch[f]=x[f];
    if(x.address&&x.address!==ex.address){const a=areaOf(x.address);if(a&&a!==ex.area)patch.area=a}
    if(x.start&&x.start>=todayStr().slice(0,8)+'01'&&x.start!==ex.start) patch.start=x.start;
    if(stop&&ex.status!=='중지') patch.status='중지';
    if(!ex.contact&&x.contact) patch.contact=x.contact;
    if(Object.keys(patch).length) upd.push({id:ex.id,name:ex.name,patch}); else same.push(ex.id);
  }
  const missing=eldersArr().filter(e=>!seen.has(e.id)&&e.status!=='중지');
  return {add,upd,same,missing};
}
function showPlan(){
  const el=document.getElementById('xprev'); if(!el) return; if(!xPlan){el.innerHTML='';return}
  const {add,upd,same,missing}=xPlan;

  el.innerHTML=`<div class="grp"><b>새로 추가 ${add.length}명</b>${add.map(x=>esc(x.name)+(x.stop?'(중지)':'')).join(', ')||'-'}</div>
   <div class="grp"><b>정보 갱신 ${upd.length}명</b>${upd.map(u=>`${esc(u.name)}(${Object.keys(u.patch).map(k=>fl[k]||k).join('·')})`).join(', ')||'-'}</div>
   <div class="grp"><b>변경 없음 ${same.length}명</b></div>
   ${missing.length?`<div class="grp"><b>엑셀에 없음 ${missing.length}명</b>${missing.map(e=>esc(e.name)).join(', ')}

   <div class="toolbar" style="margin-top:8px"><button class="primary" id="xApply" ${add.length+upd.length+missing.length?'':'disabled'}>반영하기</button><button id="xCancel">취소</button></div>`;

async function applyPlan(){
  if(!xPlan) return; if(!db||readOnly){toast('저장 권한이 없습니다');return}
  const {add,upd,missing}=xPlan; const stopMissing=document.getElementById('xStop')?.checked;
  let n=0;
  try{

      const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      const e={name:x.name,sex:x.sex,grade:x.grade,group:x.group,area:areaOf(x.address),address:x.address,place:'',contact:x.contact||'',days:[1,2,3,4,5],daysNote:'기본값 월~금 (확인 필요)',
        start:x.start&&x.start>=todayStr().slice(0,8)+'01'?x.start:'',wantAm:'',wantPm:'',note:'',status:x.stop?'중지':'이용중'};
      await db.doc('elders/'+id).set(e); elders[id]={id,...e}; n++;
    }
    for(const u of upd){const e={...elders[u.id],...u.patch};delete e.id;await db.doc('elders/'+u.id).set(e);elders[u.id]={id:u.id,...e};n++}
    if(stopMissing) for(const m of missing){const e={...elders[m.id],status:'중지'};delete e.id;await db.doc('elders/'+m.id).set(e);elders[m.id]={id:m.id,...e};n++}
    toast(`반영했습니다 (${n}건)`); xPlan=null; render();
  }catch(e){toast('반영 중 오류: '+(e&&e.code||'')+' — 다시 올려 주세요')}
}
async function readRoster(file){

let staffDocs={}; let staffYm='';
function normName(x){return String(x||'').replace(/\(.*?\)/g,'').replace(/\s/g,'')}
function staffDocFor(date){return staffDocs[date.slice(0,7)]}
function staffCell(name,date){const d=staffDocFor(date);if(!d)return null;const n=normName(name);const p=(d.staff||[]).find(x=>x.name===n);if(!p)return null;return (p.d||{})[String(+date.slice(8,10))]||''}
function isOffVal(v){return v==='X'||/연차|^연$/.test(v||'')}
function offReason(name,date=curDate){const v=staffCell(name,date);if(v==null||!isOffVal(v))return '';return v==='X'?'휴무':'연차'}
function crewHtml(names){return names.filter(Boolean).map(n=>{const r=offReason(n);return r?`<b class="need" title="${esc(n)} ${esc(r)}">변경필요</b>`:esc(n)}).join('/')}
async function unzipXlsx(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--; if(e<0) throw new Error('엑셀(xlsx) 파일이 아닙니다');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const ent={};const td=new TextDecoder();
  for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    ent[td.decode(u8.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cl}
  return async name=>{const f=ent[name];if(!f)return null;const a=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.subarray(a,a+f.cs);
    if(f.m===0)return td.decode(data);
    if(typeof DecompressionStream==='undefined') throw new Error('브라우저가 오래되어 엑셀을 읽을 수 없습니다. 크롬 최신 버전에서 올려 주세요');
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};
}
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n}
async function parseStaffXlsx(file){
  const read=await unzipXlsx(await file.arrayBuffer()), P=x=>new DOMParser().parseFromString(x,'application/xml');
  const ss=[]; {const x=await read('xl/sharedStrings.xml'); if(x) for(const si of P(x).getElementsByTagName('si')) ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}
  const diagXf=[]; {const st=P(await read('xl/styles.xml')); const bs=[...(st.getElementsByTagName('borders')[0]||{children:[]}).children].map(b=>{
      const d=b.getElementsByTagName('diagonal')[0]; const on=/^(1|true)$/.test(b.getAttribute('diagonalUp')||'')||/^(1|true)$/.test(b.getAttribute('diagonalDown')||'');
      return !!(on&&d&&d.getAttribute('style'))});
    const cx=st.getElementsByTagName('cellXfs')[0]; if(cx) [...cx.children].forEach((xf,i)=>diagXf[i]=!!bs[+xf.getAttribute('borderId')||0])}
  const wb=P(await read('xl/workbook.xml')), rels=P(await read('xl/_rels/workbook.xml.rels')); const rmap={};
  for(const r of rels.getElementsByTagName('Relationship')) rmap[r.getAttribute('Id')]=r.getAttribute('Target');
  const out=[];
  for(const sh of wb.getElementsByTagName('sheet')){
    const title=sh.getAttribute('name')||''; let tg=rmap[sh.getAttribute('r:id')]||''; tg=tg.replace(/^\/?xl\//,'').replace(/^\//,'');
    const x=await read('xl/'+tg); if(!x) continue;
    const doc=P(x); const rows={};
    for(const c of doc.getElementsByTagName('c')){const ref=c.getAttribute('r');if(!ref)continue;const row=+ref.replace(/^[A-Z]+/,''),col=colIdx(ref);
      const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0]; let val='';
      if(t==='s'&&v) val=ss[+v.textContent]||''; else if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join(''); else if(v) val=v.textContent;
      (rows[row]=rows[row]||{})[col]={v:String(val).trim(),x:!!diagXf[+c.getAttribute('s')||0]}}
    // 여러 줄을 세로로 합친 칸(예: 월례회의)은 출근 기록이 아니므로 글자를 무시
    for(const mc of doc.getElementsByTagName('mergeCell')){const m=/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(mc.getAttribute('ref')||'');if(!m)continue;
      const r1=+m[2],r2=+m[4],c1=colIdx(m[1]),c2=colIdx(m[3]); if(r2-r1<2) continue;
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) if(rows[r]&&rows[r][c]) rows[r][c].v=''}
    // 날짜 머리줄: 1,2,3… 이 이어지는 줄
    let hr=0,dayCols={};
    for(const r of Object.keys(rows).map(Number).sort((a,b)=>a-b)){const cols=Object.keys(rows[r]).map(Number).sort((a,b)=>a-b);const dc={};let k=1;
      for(const c of cols){if(rows[r][c].v===String(k)){dc[c]=k;k++}} if(k>28){hr=r;dayCols=dc;break}}
    if(!hr) continue;
    let mon=+((/(\d{1,2})\s*월/.exec(title)||[])[1]||0), yr=new Date().getFullYear();
    for(const r in rows) for(const c in rows[r]){const m=/(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(rows[r][c].v); if(m){yr=+m[1];mon=+m[2];break}}
    if(!mon) continue;
    const first=Math.min(...Object.keys(dayCols).map(Number));
    // 이름 칸: 날짜 왼쪽 칸 중 값이 가장 다양한 칸
    const cand={};for(const r in rows) if(+r>hr+1) for(const c in rows[r]) if(+c<first&&/^[가-힣]{2,5}(\(.*\))?$/.test(rows[r][c].v)) (cand[c]=cand[c]||new Set()).add(rows[r][c].v);
    const nc=+Object.keys(cand).sort((a,b)=>cand[b].size-cand[a].size)[0]; if(!nc) continue;
    const staff=[];let team='';
    for(const r of Object.keys(rows).map(Number).filter(r=>r>hr+1).sort((a,b)=>a-b)){
      const R=rows[r]; if(R[nc-1]&&R[nc-1].v) team=R[nc-1].v;
      const raw=(R[nc]||{}).v||''; if(!/^[가-힣]{2,5}(\(.*\))?$/.test(raw)) continue;
      const d={}; for(const c in dayCols){const cell=R[c]; if(!cell) continue; const val=cell.x?'X':(/\n/.test(cell.v)?'':cell.v); if(val) d[dayCols[c]]=val}
      staff.push({name:normName(raw),label:raw,role:(R[nc+1]||{}).v||'',team,d});
    }
    const ym=`${yr}-${String(mon).padStart(2,'0')}`;
    out.push({ym,title,days:Object.keys(dayCols).length,staff,uploadedAt:new Date().toISOString()});
  }
  return out;
}
function staffCarRoles(name,date){
  // 그날 송영표 기본 운전/보조 배정 (화면용)
  const w=wd(date),res=[];
  for(const S of ['am','pm']){const K=w===6?'sat'+S:S,C=CAP[K];
    for(const v of vehicles()){if(!(v[K]||[]).length)continue;
      const dd=v['driver'+C]||(w===6?'':v.driver||''),dh=v['helper'+C]||(w===6?'':v.helper||'');
      if(normName(dd)===name) res.push(`${(w===6&&v['name'+C])||v.name} ${S==='am'?'오전':'오후'} 운전`);
      if(v.assistant&&normName(dh)===name) res.push(`${(w===6&&v['name'+C])||v.name} ${S==='am'?'오전':'오후'} 보조`)}}
  return res;
}

  let h=`<div class="upbox"><h3>직원출근표 올리기</h3><p class="hint" style="margin:0 0 8px">근무일정표 엑셀(.xlsx)을 올리면 시트(6월, 7월…)마다 자동으로 읽어서 저장합니다. 같은 달을 다시 올리면 새 내용으로 바뀝니다.<br><b>빨간 사선</b>(휴무)과 <b>연차</b>인 날은 결석으로 보고, 그날 송영표에서 그 직원 이름 대신 <b class="need">변경필요</b>가 표시됩니다.</p>
    <label class="drop" style="padding:8px 14px;display:inline-block">엑셀 파일 선택<input type="file" id="stIn" accept=".xlsx" hidden></label> <span id="stMsg" class="meta"></span></div>`;
  if(!yms.length) return h+`<div class="banner">아직 올린 출근표가 없습니다.</div>`;
  h+=`<div class="toolbar"><div class="seg">${yms.map(y=>`<button data-ym="${y}" class="${y===staffYm?'on':''}">${+y.slice(5)}월</button>`).join('')}</div>
    <button id="stDel" class="ghost" style="color:var(--warn)">${+staffYm.slice(5)}월 출근표 삭제</button></div>`;
  const D=staffDocs[staffYm]; const [Y,M]=staffYm.split('-').map(Number); const nd=new Date(Y,M,0).getDate();
  if(curDate.startsWith(staffYm)){
    const off=(D.staff||[]).filter(p=>isOffVal((p.d||{})[String(+curDate.slice(8))]));
    h+=`<div class="upbox" style="padding:10px 14px"><b>${+curDate.slice(5,7)}월 ${+curDate.slice(8)}일(${DOW[wd(curDate)]}) 쉬는 직원</b>

  }

  for(let d=1;d<=nd;d++){const ds=`${staffYm}-${String(d).padStart(2,'0')}`,w=wd(ds);h+=`<th class="wd ${w===0?'sun':w===6?'sat':''}">${DOW[w]}</th>`}

      toast(`${list.map(d=>+d.ym.slice(5)+'월').join(', ')} 출근표를 반영했습니다 (${list.reduce((a,d)=>a+d.staff.length,0)}명분)`); render()}

    if(!armed){armed=true;del.textContent='한 번 더 누르면 삭제';setTimeout(()=>{armed=false;render()},3000);return}

}

  if(!db&&dbState!=='pending'){el.innerHTML=`<div class="banner">저장소에 연결할 수 없습니다. claude.ai에 로그인한 상태에서 열어 주세요.</div>`;return}

function softRender(){ // 입력 중이면 다시 그리지 않음

  if(a&&document.getElementById('view').contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)) return;

  if(!SERVER) return exportPdf();
  const el=document.getElementById('sheet'); if(!el) return;
  closePop(); el.style.zoom=''; el.classList.add('exporting'); const r=fitA4(el); el.style.zoom=(0.955*r).toFixed(3);
  const done=()=>{el.style.zoom='';setTimeout(fitSheetMobile,0);el.classList.remove('exporting','a4fit','tight','tight2');['--rg','--rm','--cm'].forEach(v=>el.style.removeProperty(v));window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);

}

  const byName={}; eldersArr().forEach(e=>{const n=(e.name||'').replace(/\s/g,'');if(!byName[n])byName[n]=e.id});
  const patch={};
  for(const K of ['satam','satpm']) for(const k in SAT_TPL[K]) SAT_TPL[K][k].forEach(([nm,t],o)=>{
    let id=byName[nm];
    if(!id){id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);byName[nm]=id;elders[id]={id,name:nm,days:[6],status:'이용',def:{}};}
    const e=patch[id]||(patch[id]={...elders[id],def:{...(elders[id].def||{})}});
    e.def[K]={...(e.def[K]||{}),k,o,t,...(SAT_PC[K][nm]?{p:SAT_PC[K][nm][0],c:SAT_PC[K][nm][1]}:{})};
    if(SAT_HL[K][nm]) e.hl={...(e.hl||{}),[K]:SAT_HL[K][nm]};
    const ds=new Set(e.days||[]); ds.add(6); e.days=[...ds].sort();
  });
  for(const id in patch) saveElder(id,patch[id]);
  const vs=JSON.parse(JSON.stringify(vehicles())).map(v=>SAT_TPL.cars[v.id]?{...v,...SAT_TPL.cars[v.id]}:v);
  config={...cfg(),vehicles:vs,orderSatAm:SAT_TPL.orderSatAm,orderSatPm:SAT_TPL.orderSatPm,satSeeded:3};
  save('config/main',config); render(); toast('토요일 기본표를 적용했습니다');
}
(async()=>{
  const h=(location.hash||'').slice(1); if(['daily','elders','cars','staff'].includes(h)) view=h;
  if(SERVER&&await window.SDC.me()) authed=true;
  if(authed) showApp();
  const timer=setTimeout(()=>{document.getElementById('conn').textContent='연결 지연 중…'},10000);
  try{ db=window.claude&&await window.claude.use('db'); }catch(e){db=null}
  try{ const user=window.claude&&await window.claude.use('user'); if(user&&user.can){const c=await user.can('data.write'); if(c===false) readOnly=true;} }catch(e){}
  try{ downloads=window.claude&&await window.claude.use('downloads'); }catch(e){downloads=null}
  dbState=db?'ok':'none';
  if(!db){clearTimeout(timer);document.getElementById('conn').textContent='저장소 없음';render();return}
  db.doc('config/main').onSnapshot(s=>{config=s.exists?s.data():null;softRender();maybeSeedSat()},()=>{});
  db.collection('elders').onSnapshot(q=>{
    clearTimeout(timer);
    const m={}; q.docs.forEach(d=>m[d.id]={id:d.id,...d.data()}); elders=m;
    if(!q.metadata.fromCache){eldersLoaded=true;const c=document.getElementById('conn');c.innerHTML='<i class="dot"></i>'+(readOnly?'보기 전용 · 실시간':'실시간 반영 중');c.classList.add('live')}
    softRender(); maybeSeedSat();
  },e=>{clearTimeout(timer);eldersLoaded=true;document.getElementById('conn').textContent='연결 오류';render()});
  try{db.collection('staff').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());staffDocs=m;softRender()},()=>{})}catch(e){}
  subscribeDay();
})();
</script>
